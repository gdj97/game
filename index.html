<script>
    let pdfs = ["1_김강민.pdf","2_김승민.pdf","3_노현웅.pdf","4_백승준.pdf","5_손상현.pdf",

    let htmls = ["1_game.html","2_game.html","3_game.html","4_game.html","5_game.html",
                "6_game.html","7_game.html","8_game.html","9_game.html"];
    function pdfopen(i) {
        let github = "https://gdj97.github.io/game/pdf/" + pdfs[i];
        window.open(github,'','');
    }
    function linkopen(i) {
      let github = "";
      if (i==3) {
        github = "https://gdj96.github.io/game/" +(i+1)+ "/project_tetris/html/"+htmls[i];
      } else {
        github = "https://gdj96.github.io/game/" +(i+1)+ "/"+htmls[i];
      }
        window.open(github,'','');
    }
</script>
