<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200"> <title>JS 게임 프로젝트 발표</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f0f2f5;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            justify-content: center;
            padding: 40px 0;
        }

        /* 전체 컨테이너 고정 폭 */
        .main-container {
            width: 1100px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* 상단 가이드 섹션 */
        .guide-box {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .guide-box pre {
            margin: 0;
            font-size: 1.05rem;
            color: #444;
            line-height: 1.6;
        }

        /* 헤더 스타일 */
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 25px;
            border-bottom: 3px solid #4361ee;
            padding-bottom: 10px;
        }

        /* 발표자 카드 그리드 (PC용 고정 5열) */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        .item-card {
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.2s;
            background: #fff;
        }
        .item-card:hover {
            border-color: #4361ee;
            background-color: #f5f7ff;
        }

        .name-tag {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
            color: #333;
        }

        /* 버튼 스타일 */
        .btn-zone {
            display: flex;
            gap: 8px;
        }
        .btn-sm-custom {
            flex: 1;
            padding: 6px 0;
            font-size: 0.85rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .b-pdf { background: #fff0f0; color: #d90429; border: 1px solid #ffccd5; }
        .b-pdf:hover { background: #d90429; color: white; }
        .b-game { background: #eef2ff; color: #4361ee; border: 1px solid #c7d2fe; }
        .b-game:hover { background: #4361ee; color: white; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="guide-box">
        <h6 class="fw-bold mb-2 text-primary"><i class="bi bi-folder-check"></i> 파일 제출 경로</h6>
        <pre>
1. 파일탐색기 > 네트워크 선택
2. 경로 : \\DESKTOP-MSLD2B5\game 이동
3. HTML : <b>번호_game.html</b> (본인 폴더)
4. PDF : <b>번호_이름.pdf</b> (pdf 폴더)
5. 완료 시 강사에게 push 요청</pre>
    </div>

    <div class="header-flex">
        <h3 class="fw-bold m-0 text-dark">자바스크립트 프로젝트 발표</h3>
        <span class="text-secondary fw-bold">2026-02-27</span>
    </div>

    <div class="project-grid" id="gridBody"></div>
</div>

<script>
    const names = ["김강민", "김승민", "노현웅", "백승준", "손상현", "장백온", "조민재", "최승우", "허태웅"];
    const pdfs = ["1_김강민.pdf","2_김승민.pdf","3_노현웅.pdf","4_백승준.pdf","5_손상현.pdf","6_장백온.pdf","7_조민재.pdf","8_최승우.pdf","9_허태웅.pdf"];
    const htmls = ["1_game.html","2_game.html","3_game.html","4_game.html","5_game.html","6_game.html","7_game.html","8_game.html","9_game.html"];

    const gridBody = document.getElementById('gridBody');

    names.forEach((name, i) => {
        gridBody.innerHTML += `
            <div class="item-card">
                <small class="text-muted">No. ${i+1}</small>
                <span class="name-tag">${name}</span>
                <div class="btn-zone">
                    <a href="javascript:void(0)" class="btn-sm-custom b-pdf" onclick="pdfopen(${i})">
                        <i class="bi bi-file-earmark-pdf"></i> PDF
                    </a>
                    <a href="javascript:void(0)" class="btn-sm-custom b-game" onclick="linkopen(${i})">
                        <i class="bi bi-play-circle"></i> GAME
                    </a>
                </div>
            </div>
        `;
    });

    function pdfopen(i) {
        window.open("https://gdj97.github.io/game/pdf/" + pdfs[i]);
    }

    function linkopen(i) {
        let url = `https://gdj96.github.io/game/${i+1}/${htmls[i]}`;
        window.open(url);
    }
</script>

</body>
</html>
