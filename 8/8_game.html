<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>JS Rhythm Game - Final Extreme Integrated Edition</title>
    <style>
        /* CSS 변수: 각 레인의 테마 색상 정의 */
        :root { 
            --color-s: #ff4444; /* S키: 레드 */
            --color-d: #ffeb3b; /* D키: 옐로우 */
            --color-j: #00f2ff; /* J키: 시안 */
            --color-k: #4caf50; /* K키: 그린 */
        }
        body { background: #121212; color: white; display: flex; flex-direction: column; align-items: center; font-family: 'Arial', sans-serif; overflow: hidden; margin: 0; }
        
        /* 상단 정보 영역 (점수, 시간, 목숨) */
        #header { width: 400px; display: flex; justify-content: space-between; padding: 20px; font-size: 1.2rem; font-weight: bold; }
        #life-container { color: #ff4444; font-size: 1.5rem; }

        /* 게임 메인 컨테이너 */
        #game-container { position: relative; width: 400px; height: 600px; background: #1a1a1a; border: 2px solid #333; display: flex; }
        
        /* 레인 스타일 */
        .lane { position: relative; width: 25%; height: 100%; border-right: 1px solid #333; box-sizing: border-box; }
        .lane:last-child { border-right: none; }

        /* 키 입력 시 레인 하단에서 올라오는 네온 그라데이션 효과 (S, D, J, K 순서 고정) */
        .lane-s.active { background: linear-gradient(to top, rgba(255, 68, 68, 0.4), transparent); }
        .lane-d.active { background: linear-gradient(to top, rgba(255, 235, 59, 0.4), transparent); }
        .lane-j.active { background: linear-gradient(to top, rgba(0, 242, 255, 0.4), transparent); }
        .lane-k.active { background: linear-gradient(to top, rgba(76, 175, 80, 0.4), transparent); }

        /* 판정선: 이 선에 맞춰 키를 눌러야 함 */
        #judge-line { position: absolute; bottom: 60px; width: 100%; height: 4px; background: white; box-shadow: 0 0 15px white; z-index: 5; }
        
        /* 노트 스타일: 스크립트에서 동적으로 색상 부여 */
        .note { position: absolute; width: 100%; height: 25px; border-radius: 4px; left: 0; }

        /* 중앙 판정 알림 영역 */
        #display-area { position: absolute; top: 30%; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
        #combo { font-size: 50px; color: white; font-weight: 900; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
        #judgment { font-size: 25px; font-weight: bold; text-shadow: 2px 2px 4px black; }

        /* 하단 키 가이드 */
        .key-guide { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: space-around; font-size: 1.5rem; font-weight: bold; }
        #key-s { color: var(--color-s); }
        #key-d { color: var(--color-d); }
        #key-j { color: var(--color-j); }
        #key-k { color: var(--color-k); }

        /* 메뉴 오버레이 공통 스타일 */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }
        .menu-btn { padding: 15px 40px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; font-size: 1.1rem; margin: 10px; transition: 0.2s; width: 250px; }
        .menu-btn:hover { transform: scale(1.1); }

        /* 익스트림 버튼 전용 특수 스타일 */
        .btn-extreme { background: #ff00ff !important; color: white !important; box-shadow: 0 0 20px #ff00ff; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="header">
        <div id="score">SCORE: 0</div>
        <div id="life-container">❤️❤️❤️</div>
        <div id="timer">TIME: 60</div>
    </div>

    <div id="game-container">
        <div id="start-menu-overlay" class="overlay">
            <h1 style="color: white; margin-bottom: 20px;">RHYTHM GAME</h1>
            <button class="menu-btn" style="background: white; color: black;" onclick="goToDifficulty()">게임 시작</button>
        </div>

        <div id="difficulty-menu-overlay" class="overlay" style="display: none;">
            <h2 style="color: white; margin-bottom: 20px;">난이도를 선택하세요</h2>
            <button class="menu-btn" style="background: #4caf50; color: white;" onclick="startGame('easy')">쉬움 (Easy)</button>
            <button class="menu-btn" style="background: #ffeb3b; color: black;" onclick="startGame('normal')">보통 (Normal)</button>
            <button class="menu-btn" style="background: #ff4444; color: white;" onclick="startGame('hard')">어려움 (Hard)</button>
            <button class="menu-btn btn-extreme" onclick="startGame('extreme')">EXTREME (Hell)</button>
        </div>

        <div class="lane lane-s" id="lane-s"></div>
        <div class="lane lane-d" id="lane-d"></div>
        <div class="lane lane-j" id="lane-j"></div>
        <div class="lane lane-k" id="lane-k"></div>
        
        <div id="display-area">
            <div id="combo"></div>
            <div id="judgment">READY?</div>
        </div>

        <div id="judge-line"></div>
        <div class="key-guide">
            <span id="key-s">S</span><span id="key-d">D</span><span id="key-j">J</span><span id="key-k">K</span>
        </div>
    </div>

    <script>
        // --- 전역 변수 및 설정 ---
        const laneElements = [
            document.getElementById('lane-s'),
            document.getElementById('lane-d'),
            document.getElementById('lane-j'),
            document.getElementById('lane-k')
        ];
        const keys = ['s', 'd', 'j', 'k'];
        const laneColors = ['var(--color-s)', 'var(--color-d)', 'var(--color-j)', 'var(--color-k)'];
        
        let score = 0;          // 현재 점수
        let combo = 0;          // 연속 성공 횟수
        let timeLeft = 60;      // 남은 시간
        let lives = 3;          // 남은 목숨
        let gameActive = false; // 게임 진행 상태 플래그
        let isExtreme = false;  // 익스트림 모드 활성화 여부
        let spawnInterval, timerInterval;

        let noteSpeed = 6;      // 노트 하강 속도 (px/frame)
        let spawnRate = 600;    // 노트 생성 주기 (ms)
        const judgeLineY = 540; // 판정선의 Y축 위치

        // --- 메뉴 전환 로직 ---
        function goToDifficulty() {
            document.getElementById('start-menu-overlay').style.display = 'none';
            document.getElementById('difficulty-menu-overlay').style.display = 'flex';
        }

        // --- 게임 시작 및 난이도 설정 로직 ---
        function startGame(level) {
            if (gameActive) return;
            isExtreme = false;

            // 난이도별 파라미터(속도, 주기) 설정
            if (level === 'easy') {
                noteSpeed = 4;
                spawnRate = 850;
            } else if (level === 'normal') {
                noteSpeed = 6;
                spawnRate = 600;
            } else if (level === 'hard') {
                noteSpeed = 9;
                spawnRate = 450;
            } else if (level === 'extreme') {
                noteSpeed = 12;  // 밸런스 조정된 극한 속도
                spawnRate = 300; // 높은 노트 밀도
                isExtreme = true;
            }

            // UI 제어
            document.getElementById('difficulty-menu-overlay').style.display = 'none';
            resetGame();
            gameActive = true;
            
            // 1. 비동기 노트 생성 엔진
            spawnInterval = setInterval(() => {
                // 기본 노트 생성
                createNote(Math.floor(Math.random() * 4));
                
                // 익스트림 모드일 때 확률적으로 추가 노트 동시 생성 (동시 치기 구현)
                if (isExtreme && Math.random() > 0.7) {
                    createNote(Math.floor(Math.random() * 4));
                }
            }, spawnRate);

            // 2. 타이머 시스템: 1초마다 시간 감소 및 종료 체크
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = `TIME: ${timeLeft}`;
                if (timeLeft <= 0) endGame(isExtreme ? "전설적인 클리어입니다!" : "시간종료! 클리어!");
            }, 1000);
        }

        // 게임 데이터 초기화 함수
        function resetGame() {
            score = 0; combo = 0; timeLeft = 60; lives = 3;
            document.getElementById('score').innerText = "SCORE: 0";
            document.getElementById('combo').innerText = "";
            document.getElementById('judgment').innerText = isExtreme ? "HELL BEGINS" : "GO!";
            document.getElementById('timer').innerText = `TIME: 60`;
            document.getElementById('life-container').innerText = "❤️❤️❤️";
        }

        // 게임 종료 처리 함수 (Shutdown Sequence)
        function endGame(msg) {
            gameActive = false;
            clearInterval(spawnInterval);
            clearInterval(timerInterval);
            alert(`${msg}\n최종 점수: ${score}`);
            document.getElementById('start-menu-overlay').style.display = 'flex'; // 초기 화면 복구
            document.getElementById('judgment').innerText = "FINISH";
        }

        // --- 노트 생성 및 독립적 이동 로직 ---
        function createNote(idx) {
            const note = document.createElement('div');
            note.className = 'note';
            note.style.top = '-30px'; 
            
            note.style.backgroundColor = laneColors[idx];
            note.style.boxShadow = `0 0 10px ${laneColors[idx]}`;
            laneElements[idx].appendChild(note);

            let noteTop = -30;
            // 개별 노트마다 고유의 이동 타이머를 할당하여 독립적 생명주기 관리
            const move = setInterval(() => {
                if (!gameActive) { clearInterval(move); note.remove(); return; }
                
                noteTop += noteSpeed; 
                note.style.top = noteTop + 'px';

                // MISS 판정 (화면 하단 이탈)
                if (noteTop > 600) {
                    clearInterval(move);
                    if (note.parentNode) {
                        note.remove(); 
                        handleMiss();  
                    }
                }
            }, 20); // 50FPS 성능 유지
            note.dataset.timerId = move; 
        }

        // --- 서바이벌 목숨 처리 로직 ---
        function handleMiss() {
            lives--; 
            applyJudgment('MISS', '#ff4444', true);
            
            // 실시간 목숨 UI 업데이트
            let heartIcons = "";
            for(let i=0; i<lives; i++) heartIcons += "❤️";
            document.getElementById('life-container').innerText = heartIcons || "OUT";

            // 목숨이 0이면 즉시 종료
            if (lives <= 0) {
                endGame(isExtreme ? "인간의 한계입니다..." : "목숨이 없습니다...");
            }
        }

        // --- 키 입력 및 정밀 거리 판정 로직 ---
        window.addEventListener('keydown', (e) => {
            if (!gameActive) return;
            const keyName = e.key.toLowerCase();
            const keyIdx = keys.indexOf(keyName);
            if (keyIdx === -1) return; // S, D, J, K 이외의 키 무시

            // 정확한 레인 인덱스에 클래스 추가 (색상 싱크 보장)
            laneElements[keyIdx].classList.add('active');

            const notes = laneElements[keyIdx].querySelectorAll('.note');
            if (notes.length > 0) {
                const target = notes[0]; // 해당 레인에서 가장 아래에 있는 노트 선택
                const currentY = parseInt(target.style.top);
                const distance = Math.abs(currentY - judgeLineY); // 판정선과의 오차 계산

                if (distance < 100) {
                    clearInterval(target.dataset.timerId); // 이동 정지
                    target.remove(); // 객체 제거
                    
                    // 거리에 따른 3단계 차등 판정
                    if (distance < 40) applyJudgment('PERFECT', '#ffffff');
                    else if (distance < 70) applyJudgment('GREAT', '#ffff00');
                    else applyJudgment('GOOD', '#cccccc');
                }
            }
        });

        // 키를 뗄 때 네온 효과 제거
        window.addEventListener('keyup', (e) => {
            const keyName = e.key.toLowerCase();
            const keyIdx = keys.indexOf(keyName);
            if (keyIdx !== -1) {
                laneElements[keyIdx].classList.remove('active');
            }
        });

        // --- 판정 결과 UI 업데이트 함수 ---
        function applyJudgment(text, color, isMiss = false) {
            const judgeEl = document.getElementById('judgment');
            const comboEl = document.getElementById('combo');
            judgeEl.innerText = text;
            judgeEl.style.color = color;

            if (isMiss) {
                combo = 0; // 콤보 초기화
                comboEl.innerText = "";
            } else {
                combo++; // 콤보 누적
                // 판정별 점수 합산
                score += (text === 'PERFECT' ? 100 : text === 'GREAT' ? 50 : 20);
                comboEl.innerText = combo > 1 ? `${combo} COMBO` : "";
                document.getElementById('score').innerText = `SCORE: ${score}`;
            }
        }
    </script>
</body>
</html>
