    .layout {
        display: flex;

    }

    /* HEAD */

        <script>

            //통합 innerHTML
            function updateDisplay() {
                moneyEl.innerHTML = `💰${money}원`;
                perclickEl.innerHTML = `${perclick}원/클릭`;
                persecondEl.innerHTML = `${persecond}원/초`;
                bgEl.innerHTML = `클릭당 +2원 증가<br>비용: ${Math.floor(perclick ** 1.3)}원`;
                psEl.innerHTML = `시간당 +1원 증가<br>비용: ${Math.floor(scmoney ** 1.3)}원`;
            }
    function beg() {
        money += perclick;
        updateDisplay();
        setInterval(() => {
            document.getElementById("")
        }, Math.floor(Math.random*1000));

        const events = [
            () => {if(event){
                alert("동전을 주웠습니다. 100원 습득") 
                money +=100;}
            },
            () => {
                if(money > 5000) {
                    alert("불량배를 만났습니다. 5000원 손실")
                const modal = document.createElement("div");
                modal.style.cssText = `
                position: fixed;
                top: 200px; left: 600px;
                width: 150px; height: 150px;
                background: rgba(0,0,0,0.6);
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                `;
                modal.innerHTML = `
            <div style="
                background: #fff;
                padding: 20px;
                border-radius: 12px;
                text-align: center;
                width: 600px;
            ">
                <img src="img/불량배.png" style="
                    width: 400px;
                    height: 400px;
                    object-fit: cover;
                    border-radius: 8px;
                "><br><br>
                <button id="close_btn" style="padding: 6px 20px; cursor: pointer;">닫기</button>
            </div>
        `;
                document.body.appendChild(modal);
                modal.querySelector("#close_btn").onclick = () => modal.remove();
                modal.onclick = () => modal.remove();
                money -= 5000;
                }
            }
        ];

        const randomEvent = events[Math.floor(Math.random() * events.length * 20)];
        randomEvent();
        
    }

    function begup() {
        const cost = perclick * 2;
        if(money < cost) {
            return;
        }
        money -= cost;
    perclick += 2;
    updateDisplay();
    }

    function timeup() {
        scmoney += 3;
        const cost = scmoney + 3;
        if(money < cost) {
            return;
        }
        money -= cost;
        persecond += 1;
        updateDisplay();
    }
    setInterval(() => {
        money += persecond;
        moneyEl.innerHTML = `💰${money}원`;
    }, 1000);

    function alba() {
    const cost = 100;
    if (money < cost) return;
    if (albaActive) return;  
    money -= cost;
    albaActive = true;
    persecond += 10;
    updateDisplay();
    document.querySelector("#alba-info").innerHTML = `✅ 고용됨<br>+10원/초`;

function alba2() {
    const cost = 2000;
    if (money < cost) return;
    if (alba2Active) return;
    money -= cost;
    alba2Active = true;
    persecond += 300;
    updateDisplay();
    document.querySelector("#alba2-info").innerHTML = `✅ 고용됨<br>+300원/초`;
    
    const img = document.createElement("img");
    img.src = "img/신문배달.png";
    img.style.width = "150px";
    img.style.height = "150px"
    img.style.position = "absolute";
    img.style.left = "40%";
    img.style.top = "70%";
    img.style.transition = "left 1s linear";
    document.querySelector("#begging").appendChild(img);

    let going = true;

    setInterval(() => {
        if(going) {
            img.style.left = "70%"
            img.style.transform = "translate(-50%, -50%) scaleX(1)";
        } else {
            img.style.left = "30%"
            img.style.transform = "translate(-50%, -50%) scaleX(-1)";
        } going = !going;
        img.style.transform = going ? "scaleX(-1)" : "scaleX(1)";
    }, 1500);
}
