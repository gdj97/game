<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가나 학습 게임</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Jua&family=M+PLUS+Rounded+1c:wght@400;700;900&display=swap');

  :root {
    --bg: #0d0d1a;
    --surface: #161628;
    --surface2: #1e1e38;
    --accent1: #ff6b6b;
    --accent2: #ffd93d;
    --accent3: #6bcb77;
    --accent4: #4d96ff;
    --text: #f0f0ff;
    --text-dim: #8888aa;
    --disabled: #2a2a45;
    --disabled-text: #44446a;
    --glow-red: 0 0 20px rgba(255,107,107,0.5);
    --glow-yellow: 0 0 20px rgba(255,217,61,0.5);
    --glow-green: 0 0 20px rgba(107,203,119,0.5);
    --glow-blue: 0 0 20px rgba(77,150,255,0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ===== 틀(frame): 절대 교체되지 않음 ===== */
  #game-container {
    width: min(480px, 100vw);
    height: min(720px, 100vh);
    background: var(--surface);
    border-radius: 24px;
    border: 1px solid #2a2a55;
    box-shadow: 0 0 60px rgba(77,150,255,0.1), 0 0 120px rgba(77,150,255,0.05);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Star bg */
  #game-container::before {
    content:'';
    position:absolute;
    inset:0;
    background-image: radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 70%, rgba(255,255,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 20%, rgba(255,255,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.15) 0%, transparent 100%);
    pointer-events:none;
    z-index:0;
  }

  /* ===== 내용물(content): render()로 교체됨 ===== */
  /* .page.active 토글 없이 항상 display:flex */
  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 24px;
    position: relative;
    z-index: 1;
  }

  /* ===== FIRST PAGE ===== */
  .game-title {
    font-size: 3rem;
    font-weight: 900;
    text-align: center;
    line-height: 1.1;
    margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent4), var(--accent1));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: titlePulse 3s ease-in-out infinite;
  }
  .game-subtitle {
    font-size: 1rem;
    color: var(--text-dim);
    margin-bottom: 48px;
    letter-spacing: 0.2em;
  }
  .kana-deco {
    font-size: 5rem;
    font-weight: 900;
    color: rgba(77,150,255,0.08);
    position: absolute;
    pointer-events: none;
  }
  .kana-deco.a { top:5%; left:5%; }
  .kana-deco.b { top:10%; right:5%; color: rgba(255,107,107,0.06); }
  .kana-deco.c { bottom:15%; left:3%; color: rgba(255,217,61,0.06); }
  .kana-deco.d { bottom:10%; right:8%; color: rgba(107,203,119,0.06); }

  @keyframes titlePulse {
    0%,100% { filter: brightness(1); }
    50% { filter: brightness(1.2); }
  }

  .btn-row { display: flex; gap: 16px; }

  .btn {
    padding: 14px 32px;
    border: none;
    border-radius: 50px;
    font-family: 'Jua', sans-serif;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content:'';
    position:absolute;
    inset:0;
    background: rgba(255,255,255,0.1);
    opacity:0;
    transition: opacity 0.2s;
  }
  .btn:hover::after { opacity:1; }
  .btn:active { transform: scale(0.95); }

  .btn-outline {
    background: transparent;
    border: 2px solid var(--accent4);
    color: var(--accent4);
  }
  .btn-outline:hover { box-shadow: var(--glow-blue); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent4), #a855f7);
    color: white;
    box-shadow: var(--glow-blue);
  }
  .btn-primary:hover { box-shadow: 0 0 30px rgba(77,150,255,0.7); transform: translateY(-2px); }

  .btn-hira {
    background: linear-gradient(135deg, var(--accent1), #f97316);
    color: white;
    box-shadow: var(--glow-red);
    font-size: 1.3rem;
    padding: 20px 40px;
  }
  .btn-hira:hover { box-shadow: 0 0 30px rgba(255,107,107,0.7); transform: translateY(-2px); }

  .btn-kata {
    background: linear-gradient(135deg, var(--accent4), #a855f7);
    color: white;
    box-shadow: var(--glow-blue);
    font-size: 1.3rem;
    padding: 20px 40px;
  }
  .btn-kata:hover { box-shadow: 0 0 30px rgba(77,150,255,0.7); transform: translateY(-2px); }

  .btn-back {
    position: absolute;
    bottom: 20px;
    right: 20px;
    background: var(--surface2);
    border: 1px solid #3a3a5c;
    color: var(--text-dim);
    padding: 10px 20px;
    font-size: 0.9rem;
  }
  .btn-back:hover { color: var(--text); border-color: var(--accent4); }

  /* ===== SECOND PAGE ===== */
  .page-title {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 8px;
    color: var(--text);
  }
  .page-sub {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 40px;
    letter-spacing: 0.1em;
  }
  .select-row { display: flex; gap: 24px; }
  .select-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .kana-preview {
    font-size: 3rem;
    font-weight: 900;
    line-height: 1;
  }

  /* ===== THIRD PAGE ===== */
  .section-header {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .section-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
    margin-bottom: 24px;
    letter-spacing: 0.15em;
  }
  .row-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 100%;
  }
  .row-btn {
    padding: 14px 8px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: var(--surface2);
    color: var(--text);
    font-family: 'M PLUS Rounded 1c', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .row-btn .jp { font-size: 1rem; }
  .row-btn.hira:not(:disabled) { border-color: rgba(255,107,107,0.4); }
  .row-btn.hira:not(:disabled):hover {
    background: rgba(255,107,107,0.15);
    border-color: var(--accent1);
    box-shadow: var(--glow-red);
    transform: translateY(-2px);
  }
  .row-btn.kata:not(:disabled) { border-color: rgba(77,150,255,0.4); }
  .row-btn.kata:not(:disabled):hover {
    background: rgba(77,150,255,0.15);
    border-color: var(--accent4);
    box-shadow: var(--glow-blue);
    transform: translateY(-2px);
  }
  .row-btn.cleared {
    border-color: var(--accent3) !important;
    background: rgba(107,203,119,0.15) !important;
  }
  .row-btn.cleared .jp { color: var(--accent3); }
  .row-btn:disabled {
    background: var(--disabled);
    color: var(--disabled-text);
    cursor: not-allowed;
    border-color: transparent;
  }

  /* ===== FOURTH PAGE ===== */
  /* id 대신 class로 변경 */
  .fourth-page {
    justify-content: flex-start;
    padding: 16px;
  }
  .fp-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    width: 100%;
    margin-bottom: 12px;
    gap: 12px;
  }
  .prompt-boxes { display: flex; gap: 6px; flex-wrap: wrap; }
  .prompt-box {
    width: 48px;
    height: 52px;
    border-radius: 10px;
    background: var(--surface2);
    border: 2px solid #3a3a5c;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    transition: all 0.3s;
    gap: 1px;
  }
  .prompt-box .jp { font-size: 1.3rem; line-height:1; }
  .prompt-box.current {
    background: rgba(255,217,61,0.15);
    border-color: var(--accent2);
    box-shadow: var(--glow-yellow);
  }
  .prompt-box.current .jp { color: var(--accent2); }
  .prompt-box.done {
    background: rgba(107,203,119,0.15);
    border-color: var(--accent3);
  }
  .prompt-box.done .jp { color: var(--accent3); }
  .fp-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    min-width: 90px;
  }
  .timer-display {
    font-size: 2rem;
    font-weight: 900;
    color: var(--accent2);
    text-align: center;
    width: 90px;
    background: rgba(255,217,61,0.1);
    border: 2px solid rgba(255,217,61,0.3);
    border-radius: 12px;
    padding: 4px;
    line-height: 1;
  }
  .timer-display.danger {
    color: var(--accent1);
    background: rgba(255,107,107,0.1);
    border-color: rgba(255,107,107,0.4);
    animation: timerShake 0.5s infinite;
  }
  @keyframes timerShake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  .btn-start {
    background: linear-gradient(135deg, var(--accent3), #22c55e);
    color: #0d1a0d;
    font-family: 'Jua', sans-serif;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.2s;
  }
  .btn-start:hover { transform: scale(1.05); box-shadow: var(--glow-green); }
  .btn-start:disabled { background: var(--disabled); color: var(--disabled-text); cursor: not-allowed; transform: none; box-shadow: none; }

  /* Game field */
  .game-field {
    width: 100%;
    flex: 1;
    background: rgba(0,0,0,0.3);
    border-radius: 16px;
    border: 1px solid #2a2a45;
    position: relative;
    overflow: hidden;
    margin-bottom: 50px;
  }
  .floating-char {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 56px;
    height: 60px;
    border-radius: 12px;
    background: var(--surface2);
    border: 2px solid #3a3a5c;
    cursor: pointer;
    transition: border-color 0.1s;
    user-select: none;
    font-weight: 700;
    z-index: 2;
  }
  .floating-char .jp { font-size: 1.4rem; line-height:1; }
  .floating-char:hover { border-color: var(--accent4); }
  .floating-char.wrong {
    border-color: var(--accent1);
    background: rgba(255,107,107,0.2);
    animation: wrongFlash 1s ease;
  }
  .floating-char.wrong .jp { color: var(--accent1); }
  @keyframes wrongFlash {
    0% { transform: scale(1.1); }
    50% { transform: scale(0.95); }
    100% { transform: scale(1); }
  }

  /* Popup */
  .popup-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .popup-overlay.active { display: flex; }
  .popup-box {
    background: var(--surface2);
    border: 1px solid #3a3a5c;
    border-radius: 20px;
    padding: 28px 32px;
    max-width: 340px;
    width: 90%;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  .popup-box h3 { font-size: 1.2rem; margin-bottom: 16px; color: var(--accent2); }
  .popup-box p { font-size: 0.85rem; color: var(--text-dim); line-height: 1.7; margin-bottom: 20px; }
  .popup-box .btn { width: 100%; }

  /* Progress bar */
  .progress-row {
    width: 100%;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }
  .progress-bar {
    flex: 1;
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent4), var(--accent3));
    border-radius: 2px;
    transition: width 0.3s;
  }

  /* Score popup */
  .score-popup {
    position: absolute;
    font-size: 1.5rem;
    font-weight: 900;
    pointer-events: none;
    animation: scoreFloat 1s ease forwards;
    z-index: 10;
    text-shadow: 0 0 10px currentColor;
  }
  @keyframes scoreFloat {
    0% { opacity:1; transform: translateY(0) scale(1); }
    100% { opacity:0; transform: translateY(-40px) scale(1.3); }
  }
</style>
</head>
<body>

<!-- ✅ div 하나만! 이 안의 내용이 render()로 교체됨 -->
<div id="game-container"></div>

<script src="kana_single.js"></script>
</body>
</html>
